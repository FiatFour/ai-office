name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  check:
    name: check (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["20", "lts/*"]
        include:
          - os: ubuntu-latest
            node: "22.18"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: node --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  server-live:
    name: server live (docker, podman, kill -9, CLI processes, lock race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run the docker, process and lock-race tests on their own
        run: |
          pnpm vitest run server/test/sandbox/driver.test.ts server/test/kill9.test.ts server/test/cli.test.ts server/test/lockrace.test.ts server/test/perf.test.ts
          if ($LASTEXITCODE -ne 0) { throw "the live server tests failed" }
      - name: Run the heavy benchmark harness tests (real cages, git, graded runs)
        run: |
          pnpm test:bench-live
          if ($LASTEXITCODE -ne 0) { throw "the benchmark live tests failed" }

  contract:
    name: contract (${{ matrix.cell }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cell: linux
          - os: macos-latest
            cell: macos
          - os: windows-latest
            cell: windows
    env:
      CONTRACT_RESULTS: ${{ github.workspace }}/contract-results/${{ matrix.cell }}.jsonl
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: What this runner offers
        run: |
          foreach ($tool in 'docker', 'podman') {
            $found = Get-Command $tool -ErrorAction SilentlyContinue
            if ($null -eq $found) { Write-Host "$tool : not installed"; continue }
            & $tool --version
            if ($tool -eq 'docker') { & docker info --format 'docker OSType={{.OSType}} rootless={{.SecurityOptions}}' }
            if ($tool -eq 'podman') { & podman info --format 'podman os={{.Host.OS}} rootless={{.Host.Security.Rootless}}' }
          }
          Write-Host ("/dev/kvm present: " + (Test-Path /dev/kvm))
          exit 0
      - name: Run the SandboxDriver and GitHost contracts and their self test
        run: |
          New-Item -ItemType Directory -Force (Split-Path $env:CONTRACT_RESULTS) | Out-Null
          pnpm vitest run test/contract
          if ($LASTEXITCODE -ne 0) { throw "a contract case failed" }
      - name: Table for this runner
        if: ${{ !cancelled() }}
        run: |
          node scripts/contract-table.mjs contract-results ${{ matrix.cell }}
          if ($LASTEXITCODE -ne 0) { throw "a cell on this runner is blank or failed" }
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: contract-${{ matrix.cell }}
          path: contract-results
          if-no-files-found: error

  contract-table:
    name: contract table (driver by OS)
    needs: contract
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
      - uses: actions/download-artifact@v8
        with:
          pattern: contract-*
          merge-multiple: true
          path: contract-results
      - name: Every driver on every OS is a pass, a failure or a named reason
        run: |
          node scripts/contract-table.mjs contract-results
          if ($LASTEXITCODE -ne 0) { throw "the table has a blank cell or a failure" }

  contract-mutants:
    name: contract mutants (every broken guard fails a contract case or the table)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Break each guard in turn and require a contract case to fail
        run: |
          $env:MUTANT_OUT = Join-Path $env:RUNNER_TEMP 'contract-mutants.txt'
          node test/contract/mutants.mjs
          $status = $LASTEXITCODE
          Get-Content $env:MUTANT_OUT | Select-Object -Last 1 | Add-Content $env:GITHUB_STEP_SUMMARY
          if ($status -ne 0) { throw "a contract mutant survived or could not be applied" }

  bench-mutants:
    name: bench mutants (the whole suite, every mutant caught)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Break each guard in turn and require a test to fail
        run: |
          $env:MUTANT_OUT = Join-Path $env:RUNNER_TEMP 'mutants.txt'
          node bench/test/mutants.mjs
          $status = $LASTEXITCODE
          Get-Content $env:MUTANT_OUT | Select-Object -Last 1 | Add-Content $env:GITHUB_STEP_SUMMARY
          if ($status -ne 0) { throw "a bench mutant survived or could not be applied" }

  perf:
    name: perf (cold and warm install, lint, typecheck, light test suite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
      - name: Time three cold and three warm runs
        run: |
          $budgetSeconds = 60
          $root = Join-Path $env:RUNNER_TEMP 'perf'
          $warmStore = Join-Path $root 'store-warm'
          function Measure-Run([string] $store, [string] $label) {
            $clone = Join-Path $root ([guid]::NewGuid())
            git clone --quiet --no-hardlinks $env:GITHUB_WORKSPACE $clone
            Push-Location $clone
            $elapsed = Measure-Command {
              $steps = @(
                @('install', '--frozen-lockfile', '--store-dir', $store, '--cache-dir', "$store-cache"),
                @('lint'), @('typecheck'),
                @('vitest', 'run', '--exclude', 'server/test/sandbox/driver.test.ts', '--exclude', 'server/test/kill9.test.ts',
                  '--exclude', 'server/test/cli.test.ts', '--exclude', 'server/test/lockrace.test.ts', '--exclude', 'server/test/perf.test.ts',
                  '--exclude', 'bench/test/task-setup.test.ts', '--exclude', 'bench/test/closure.test.ts', '--exclude', 'bench/test/cage-mount.test.ts',
                  '--exclude', 'bench/test/arms.test.ts', '--exclude', 'bench/test/cli.test.ts',
                  '--exclude', 'test/contract/sandbox.real.test.ts')
              )
              foreach ($step in $steps) {
                & pnpm @step | Out-Host
                if ($LASTEXITCODE -ne 0) { throw "pnpm $($step[0]) failed in the $label run" }
              }
            }
            Pop-Location
            Write-Host ("{0}: {1:N1} s" -f $label, $elapsed.TotalSeconds)
            $elapsed.TotalSeconds
          }
          $cold = 1..3 | ForEach-Object { Measure-Run (Join-Path $root "store-cold-$_") "cold $_" }
          Measure-Run $warmStore 'warm-up' | Out-Null
          $warm = 1..3 | ForEach-Object { Measure-Run $warmStore "warm $_" }
          $coldMedian = ($cold | Sort-Object)[1]
          $warmMedian = ($warm | Sort-Object)[1]
          "| run | median seconds |`n| --- | --- |`n| cold | {0:N1} |`n| warm | {1:N1} |" -f $coldMedian, $warmMedian |
            Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          Write-Host ("cold median {0:N1} s, warm median {1:N1} s, budget {2} s" -f $coldMedian, $warmMedian, $budgetSeconds)
          if ($warmMedian -gt $budgetSeconds) { throw "warm median $warmMedian s exceeds the $budgetSeconds s budget" }

  perf-core:
    name: perf (lifecycle reducer throughput and property suite time)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Time the property suite three times
        run: |
          $budgetSeconds = 120
          $times = 1..3 | ForEach-Object {
            $elapsed = Measure-Command { pnpm vitest run packages/core | Out-Host }
            if ($LASTEXITCODE -ne 0) { throw "property suite failed in run $_" }
            Write-Host ("suite run {0}: {1:N1} s" -f $_, $elapsed.TotalSeconds)
            $elapsed.TotalSeconds
          }
          $median = ($times | Sort-Object)[1]
          "| metric | seconds |`n| --- | --- |`n| property suite median of 3 | {0:N1} |" -f $median |
            Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          Write-Host ("median {0:N1} s, budget {1} s, no baseline, trunk empty" -f $median, $budgetSeconds)
          if ($median -gt $budgetSeconds) { throw "median $median s exceeds the $budgetSeconds s budget" }
      - name: Reducer throughput, small and large states
        run: |
          pnpm vitest run --config packages/core/vitest.perf.config.ts 2>&1 | Tee-Object -FilePath throughput.txt
          if ($LASTEXITCODE -ne 0) { throw "the throughput probe failed" }
          node scripts/check-throughput.mjs throughput.txt
          if ($LASTEXITCODE -ne 0) { throw "the throughput probe printed no throughput result" }
      - name: Add throughput to the summary
        run: |
          '```' | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          Get-Content throughput.txt | Where-Object { $_ -match 'throughput|run [0-9]|median|chunk|PASS|FAIL' } |
            Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          '```' | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY

  src:
    name: src (floor typecheck, unit tests, build, bundle size)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @agent-works/floor typecheck
      - run: pnpm test src
      - run: pnpm --filter @agent-works/floor build
      - name: Gzipped JS bundle must stay under 400 KB
        run: pnpm --filter @agent-works/floor size

  floor-e2e:
    name: floor e2e (Playwright lanes, axe, reduced motion, frame time)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @agent-works/floor build
      - run: pnpm --filter @agent-works/floor exec playwright install --with-deps chromium
      - name: Ten floor lanes against a demo HQ and a real HQ
        run: |
          node src/e2e/lanes.mjs
          if ($LASTEXITCODE -ne 0) { throw "a floor lane failed" }
      - name: Frame time with six workers, 30 s
        run: |
          node src/e2e/perf.mjs
          if ($LASTEXITCODE -ne 0) { throw "frame time over 16.7 ms p95" }
