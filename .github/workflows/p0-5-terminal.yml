name: p0-5-terminal

on:
  pull_request:
    paths:
      - spikes/P0-5/**
      - .github/workflows/p0-5-terminal.yml

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  lanes:
    name: lanes (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux
            lane-args: ""
          - os: windows-latest
            label: windows
            lane-args: --mount-style wsl
          - os: macos-15-intel
            label: macos-intel
            lane-args: ""
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir spikes/P0-5 exec playwright install chromium ${{ runner.os == 'Linux' && '--with-deps' || '' }}
      - name: Start Docker in a Colima VM
        if: runner.os == 'macOS'
        run: |
          brew install colima docker
          colima start --cpu 2 --memory 2
          docker info --format 'Colima daemon OSType: {{.OSType}}, kernel {{.KernelVersion}}'
      - name: Run a Linux docker daemon in WSL 2 for docker.exe
        if: runner.os == 'Windows'
        run: |
          docker info --format 'runner daemon OSType: {{.OSType}}'
          wsl --install -d Debian --no-launch --web-download
          wsl -d Debian -u root -- sh -c 'apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq docker.io >/dev/null'
          wsl -d Debian -u root -- sh -c 'systemctl stop docker.service docker.socket 2>/dev/null || service docker stop; rm -f /var/run/docker.pid'
          Start-Process wsl -WindowStyle Hidden -ArgumentList '-d', 'Debian', '-u', 'root', '--', 'sh', '-c', '"dockerd -H unix:///var/run/docker.sock -H tcp://127.0.0.1:2375 --tls=false > /var/log/dockerd.log 2>&1"'
          $env:DOCKER_HOST = 'tcp://127.0.0.1:2375'
          $deadline = (Get-Date).AddMinutes(2)
          while ($true) {
            docker.exe info *> $null
            if ($LASTEXITCODE -eq 0) { break }
            if ((Get-Date) -gt $deadline) {
              wsl -d Debian -u root -- sh -c 'tail -40 /var/log/dockerd.log; ss -ltn'
              throw 'the WSL docker daemon did not answer docker.exe within 2 minutes'
            }
            Start-Sleep -Seconds 2
          }
          docker.exe info --format 'WSL daemon OSType: {{.OSType}}, kernel {{.KernelVersion}}'
          "DOCKER_HOST=$env:DOCKER_HOST" >> $env:GITHUB_ENV
      - run: node spikes/P0-5/lanes.mjs --label ${{ matrix.label }} --out "${{ runner.temp }}/p0-5" ${{ matrix.lane-args }}
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: p0-5-${{ matrix.label }}
          path: ${{ runner.temp }}/p0-5
