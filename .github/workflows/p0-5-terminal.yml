name: p0-5-terminal

on:
  push:
    branches: [aw/p0-5]

permissions:
  contents: read

jobs:
  probe-wsl:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - run: wsl --install -d Debian --no-launch --web-download
        continue-on-error: true
      - run: wsl -l -v; wsl -d Debian -u root -- uname -a; wsl -d Debian -u root -- cat /proc/version
        continue-on-error: true
      - run: wsl --set-version Debian 1; wsl -l -v; wsl -d Debian -u root -- uname -a
        continue-on-error: true

  probe-colima:
    runs-on: macos-15-intel
    timeout-minutes: 25
    steps:
      - run: brew install colima docker
      - run: colima start --cpu 2 --memory 2 2>&1 | tail -40
        continue-on-error: true
      - run: docker version; docker run --rm debian:trixie-slim uname -a
        continue-on-error: true
