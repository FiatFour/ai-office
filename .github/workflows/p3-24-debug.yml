name: p3-24-debug
on:
  push:
    branches: [aw/p3-24]
jobs:
  dbg:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Run a Linux docker daemon in WSL 2 for docker.exe
        run: |
          docker info --format 'runner daemon OSType: {{.OSType}}'
          wsl --install -d Debian --no-launch --web-download
          wsl -d Debian -u root -- sh -c 'apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq docker.io >/dev/null'
          wsl -d Debian -u root -- sh -c 'systemctl stop docker.service docker.socket 2>/dev/null || service docker stop; rm -f /var/run/docker.pid'
          Start-Process wsl -WindowStyle Hidden -ArgumentList '-d', 'Debian', '-u', 'root', '--', 'sh', '-c', '"dockerd -H unix:///var/run/docker.sock -H tcp://127.0.0.1:2375 --tls=false > /var/log/dockerd.log 2>&1"'
          $env:DOCKER_HOST = 'tcp://127.0.0.1:2375'
          $deadline = (Get-Date).AddMinutes(2)
          while ($true) {
            docker.exe info *> $null
            if ($LASTEXITCODE -eq 0) { break }
            if ((Get-Date) -gt $deadline) {
              wsl -d Debian -u root -- sh -c 'tail -40 /var/log/dockerd.log; ss -ltn'
              throw 'the WSL docker daemon did not answer docker.exe within 2 minutes'
            }
            Start-Sleep -Seconds 2
          }
          docker.exe info --format 'WSL daemon OSType: {{.OSType}}, kernel {{.KernelVersion}}'
          "DOCKER_HOST=$env:DOCKER_HOST" >> $env:GITHUB_ENV
      - name: experiments
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          docker build -t aw-test-cage:1 -f server/test/sandbox/Containerfile.test server/test/sandbox 2>&1 | Select-Object -Last 3
          function T($label, $a) { Write-Host "=== $label"; $o = & docker.exe @a 2>&1; Write-Host "exit=$LASTEXITCODE out=[$($o -join '|')]" }
          $img = 'aw-test-cage:1'
          $d = Join-Path $env:RUNNER_TEMP 'bindtest'; New-Item -ItemType Directory -Force $d | Out-Null
          Write-Host "RUNNER_TEMP=$env:RUNNER_TEMP"
          $m = "type=bind,src=/mnt/d/a/_temp/bindtest,dst=/work"
          T 'echo+sleep2' @('run','--rm','--entrypoint','sh',$img,'-c','echo hi; sleep 2')
          T 'echo -i' @('run','--rm','-i','--entrypoint','sh',$img,'-c','echo hi')
          T 'echo -a stdout' @('run','--rm','-a','stdout','--entrypoint','sh',$img,'-c','echo hi')
          T 'file in bind' @('run','--rm','--mount',$m,'--entrypoint','sh',$img,'-c','echo viafile > /work/o1; id > /work/o2; ls -ld /work >> /work/o2')
          Get-ChildItem $d | ForEach-Object { Write-Host "FILE $($_.Name): $(Get-Content $_.FullName -Raw)" }
          T 'git init to file' @('run','--rm','--mount',$m,'-e','HOME=/tmp','--entrypoint','sh',$img,'-c','cd /work && git init -q -b main > /work/o3 2>&1; echo rc=$? >> /work/o3')
          Get-ChildItem $d -Force | ForEach-Object { Write-Host "FILE $($_.Name): $(if (-not $_.PSIsContainer) { Get-Content $_.FullName -Raw })" }
          T 'git init hardened to file' @('run','--rm','--network','none','--cap-drop','ALL','--security-opt','no-new-privileges','--read-only','--tmpfs','/tmp:rw,size=256m','--mount',$m,'-e','HOME=/tmp','--entrypoint','sh',$img,'-c','cd /work && rm -rf .git && git init -q -b main > /work/o4 2>&1; echo rc=$? >> /work/o4')
          Get-Content "$d/o4"
          T 'create+start -a' @('create','--name','c1','--entrypoint','sh',$img,'-c','echo hi')
          T 'start' @('start','-a','c1')
          T 'run -d + logs' @('run','-d','--name','c2','--entrypoint','sh',$img,'-c','echo hi')
          Start-Sleep 2
          T 'logs' @('logs','c2')
          Write-Host (docker.exe version 2>&1 | Out-String)
